# The web container's own server (P5-4a): the single-page app plus the two API routes.
#
# The edge in front of it (deploy/env/edge-https.conf.tpl) has already turned the visitor's address
# into $remote_addr there and sends it here as X-Forwarded-For / X-Real-IP with
# X-Forwarded-Proto https. This server passes those headers through UNCHANGED rather than
# appending its own hop: the API trusts exactly one proxy (`trust proxy` 1), so the right-most
# X-Forwarded-For entry must be the visitor, or every login would share one rate-limit bucket.

# Which api this web proxies to (P5-4c blue/green): `upstream bylinecrm_api { server …:3000; }`.
# The image ships /etc/nginx/dynamic/api-upstream.conf naming the plain `api` service; a deployed
# stack bind-mounts its runtime copy naming the live colour (api-blue / api-green) and applies a
# change with `nginx -s reload`, so the switch is atomic per worker and drops no connection.
include /etc/nginx/dynamic/*.conf;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Attachments are capped at 25 MiB by the API (ATTACHMENT_MAX_BYTES); leave room for the
    # multipart envelope.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://bylinecrm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://bylinecrm_api;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change under a name: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is a client-side route: the app shell, never cached, so a deploy is
    # picked up on the next navigation.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
