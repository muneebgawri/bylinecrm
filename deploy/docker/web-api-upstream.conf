# The api this web proxies to — the image's default, for a stack whose api service is named `api`.
# A deployed environment mounts $BYLINECRM_RUNTIME/web-dynamic/ over /etc/nginx/dynamic/ with the live
# colour (api-blue or api-green) instead; release-remote.sh rewrites it and reloads nginx (P5-4c).
upstream bylinecrm_api {
    server api:3000;
}
