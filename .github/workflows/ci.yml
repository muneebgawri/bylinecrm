name: ci

on:
    push:
        branches: [main]
    pull_request:
    # `baseline: true` adds the visual-baseline job (see packages/ui/README.md, "Visual baselines").
    # It lives in this file because GitHub only dispatches a workflow that exists on the default
    # branch — a separate workflow could never produce its own first baseline from a PR.
    workflow_dispatch:
        inputs:
            baseline:
                description: Regenerate the visual baselines (design system and route gate) and upload them as artifacts
                type: boolean
                default: false

# packages: read lets the jobs pull the mirrored third-party images from GHCR with this token (#123).
permissions:
    contents: read
    packages: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# The API's environment is set on the jobs that run the API, never globally: tools such as
# sirv-cli read PORT/HOST from the environment ahead of their own flags, and a global PORT moved
# the design system's static server off the port the gates were probing.
jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm typecheck

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm lint
            - run: pnpm format:check
            # Every image comes from our GHCR mirror by a listed digest (#123).
            - run: pnpm images:check

    test:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://bylinecrm:bylinecrm@127.0.0.1:5432/bylinecrm
            RLS_DATABASE_URL: postgresql://bylinecrm_app:bylinecrm_app@127.0.0.1:5432/bylinecrm
            REDIS_URL: redis://127.0.0.1:6379
            PORT: '3300'
            WEB_PORT: '3301'
            APP_URL: http://localhost:3300
            WEB_URL: http://localhost:3301
            SECRETS_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
            WEBHOOK_ALLOW_PRIVATE_TARGETS: '1'
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm test
            # The staging release refuses an environment the new image would not boot (#120).
            - run: pnpm test:deploy
            - run: pnpm test:scripts
            # Every requirement of a complete phase is named by a test (doc 49 §7, #69).
            - run: pnpm fr:check
            # The client contract (P1-1c): a typed client generated from openapi.json must type-check.
            - run: pnpm --filter api contract:check

    cross-tenant:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://bylinecrm:bylinecrm@127.0.0.1:5432/bylinecrm
            RLS_DATABASE_URL: postgresql://bylinecrm_app:bylinecrm_app@127.0.0.1:5432/bylinecrm
            REDIS_URL: redis://127.0.0.1:6379
            PORT: '3300'
            WEB_PORT: '3301'
            APP_URL: http://localhost:3300
            WEB_URL: http://localhost:3301
            SECRETS_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
            WEBHOOK_ALLOW_PRIVATE_TARGETS: '1'
        services:
            postgres:
                # postgres:16, mirrored by digest (deploy/images/mirror.json, #123).
                image: ghcr.io/muneebgawri/mirror/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
                credentials:
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
                env:
                    POSTGRES_USER: bylinecrm
                    POSTGRES_PASSWORD: bylinecrm
                    POSTGRES_DB: bylinecrm
                ports: ['5432:5432']
                options: --health-cmd "pg_isready -U bylinecrm" --health-interval 5s --health-timeout 3s --health-retries 10
            redis:
                # valkey:9.1, mirrored by digest (deploy/images/mirror.json, #123).
                image: ghcr.io/muneebgawri/mirror/valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
                credentials:
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
                ports: ['6379:6379']
                options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm --filter api db:setup
            - run: pnpm --filter api test:cross-tenant

    # The web bundle's size budget (apps/web/.size-limit.json, FR-CRMS-UI-10): a production build,
    # then size-limit over the initial chunks. A chunk over budget fails the job.
    bundle:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm --filter @bylinecrm/shared build
            - run: pnpm --filter web build
            - run: pnpm --filter web size

    licence-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm scan:licences

    identifier-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm scan:identifiers

    a11y:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/ui-browser
            - run: pnpm --filter @bylinecrm/ui build-storybook
            - run: pnpm --filter @bylinecrm/ui test:a11y
            - run: pnpm --filter @bylinecrm/ui test:layout

    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/ui-browser
            - run: pnpm --filter @bylinecrm/ui build-storybook
            - run: pnpm --filter @bylinecrm/ui test:visual
              env:
                  DEBUG: pw:webserver
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: visual-diffs
                  path: packages/ui/test-results
                  if-no-files-found: ignore

    # The route gate (apps/web/e2e, P0-10): every page of the web app at phone, tablet and desktop
    # width in both themes — axe at WCAG 2.1 AA, no sideways page scroll, touch targets and field
    # text sizes on phones, the primary action on screen, and phone screenshots against baselines.
    # Two shards keep the wall-clock short; `routes` is the one check branch protection names.
    routes-shard:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/ui-browser
            - run: pnpm --filter @bylinecrm/shared build
            - run: pnpm --filter web build
            - run: pnpm --filter web test:routes --shard ${{ matrix.shard }}/2
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: routes-diffs-${{ matrix.shard }}
                  path: apps/web/e2e/test-results
                  if-no-files-found: ignore

    routes:
        needs: routes-shard
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Both shards passed
              run: test "${{ needs.routes-shard.result }}" = success

    visual-baseline:
        if: github.event_name == 'workflow_dispatch' && inputs.baseline
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/ui-browser
            - run: pnpm --filter @bylinecrm/ui build-storybook
            - run: pnpm --filter @bylinecrm/ui test:visual:update
              env:
                  DEBUG: pw:webserver
            - uses: actions/upload-artifact@v4
              with:
                  name: visual-baselines
                  path: packages/ui/__snapshots__
                  if-no-files-found: error

    # The route gate's phone screenshots, made on the runner (apps/web README, "Route gate").
    routes-baseline:
        if: github.event_name == 'workflow_dispatch' && inputs.baseline
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/ui-browser
            - run: pnpm --filter @bylinecrm/shared build
            - run: pnpm --filter web build
            - run: pnpm --filter web test:routes:update
            - uses: actions/upload-artifact@v4
              with:
                  name: routes-baselines
                  path: apps/web/e2e/__snapshots__
                  if-no-files-found: error
