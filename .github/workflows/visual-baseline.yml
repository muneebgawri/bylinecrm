name: visual-baseline

# Regenerates the design system's visual baselines on the same runner image CI compares against,
# and publishes them as an artifact for `pnpm --filter @bylinecrm/ui visual:baseline` to download.
# Manual only: a baseline is a reviewed decision that lands in the PR that changed the pixels.
on:
    workflow_dispatch:

jobs:
    baseline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - uses: ./.github/actions/ui-browser
            - run: pnpm --filter @bylinecrm/ui build-storybook
            - run: pnpm --filter @bylinecrm/ui test:visual:update
            - uses: actions/upload-artifact@v4
              with:
                  name: visual-baselines
                  path: packages/ui/__snapshots__
                  if-no-files-found: error
