name: images

# Builds the deployable images (P5-4a) for every commit that lands on main and publishes them to
# GHCR as ghcr.io/<owner>/bylinecrm-{api,web}:<sha> and :main. deploy/staging/deploy.sh pulls them;
# nothing is ever built on the server.
#
# Never runs on pull requests (a PR's code is not deployable, and a fork must not get a token that
# can write packages) and is not a required check: main's protection is ci.yml's jobs.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: images-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                image: [api, web]
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: deploy/docker/${{ matrix.image }}.Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/bylinecrm-${{ matrix.image }}:${{ github.sha }}
                      ghcr.io/${{ github.repository_owner }}/bylinecrm-${{ matrix.image }}:main
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
