# Local development stack only. Production is deployed separately (doc 49, P5-4).
# Host ports are chosen not to collide with the other local stacks on this machine
# (NewswireOS uses 5432/6379, its second stack 6390); the API reads them from .env.
services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: bylinecrm
            POSTGRES_PASSWORD: bylinecrm
            POSTGRES_DB: bylinecrm
        ports:
            - '127.0.0.1:5441:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U bylinecrm']
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        # Valkey (D-250), the same 9.1 as CI and staging; the service keeps its name so REDIS_URL is unchanged.
        image: valkey/valkey:9.1
        ports:
            - '127.0.0.1:6391:6379'
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
